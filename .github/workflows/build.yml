name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: JDK ${{ matrix.java-version }}
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 21, 25 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean install

  build-native:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean install -DskipTests

      - name: Build with Maven (Native)
        run: mvn -B install -Dnative -Dquarkus.native.container-build -Dnative.surefire.skip -pl integration-tests/default,integration-tests/tls

  compatibility:
    name: Qdrant ${{ matrix.qdrant-version }}
    strategy:
      fail-fast: false
      matrix:
        # We support the three most recent Qdrant minor releases and nothing
        # older. On a new minor release, add it here and drop the oldest entry.
        # The newest one (the project default) is covered by the build job above.
        qdrant-version: [ v1.18, v1.19 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      # The image is resolved in two places: Dev Services reads it from build-time
      # config, the TLS tests from the qdrant.container.image Maven property.
      - name: Build with Maven
        env:
          QDRANT_IMAGE: docker.io/qdrant/qdrant:${{ matrix.qdrant-version }}-unprivileged
        run: |
          mvn -B clean install \
            -Dqdrant.container.image="$QDRANT_IMAGE" \
            -Dquarkus.qdrant.devservices.qdrant-image-name="$QDRANT_IMAGE"
