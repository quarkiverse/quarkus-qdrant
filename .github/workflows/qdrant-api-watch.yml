name: Qdrant API Watch

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check-api-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for new Qdrant release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          baseline=$(jq -r '.qdrant_version' .github/qdrant-api-baseline.json)

          # Tags rather than releases/latest. Qdrant publishes the tag and the
          # container images before the GitHub release object, so releases/latest
          # lags: v1.20.0 was installable for over a day while it still reported
          # v1.19.2. Pre-release tags are filtered out by the version pattern.
          latest=$(git ls-remote --tags --refs https://github.com/qdrant/qdrant.git \
            | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)

          echo "Baseline: $baseline"
          echo "Latest: $latest"

          if [ -z "$latest" ]; then
            echo "Could not determine the latest Qdrant tag."
            exit 1
          fi

          newest=$(printf '%s\n%s\n' "$baseline" "$latest" | sort -V | tail -1)
          if [ "$newest" = "$baseline" ]; then
            echo "Baseline is current."
            exit 0
          fi

          existing=$(gh issue list --label "qdrant-api-change" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open, skipping."
            exit 0
          fi

          gh issue create \
            --title "New Qdrant release: ${latest} (current: ${baseline})" \
            --label "qdrant-api-change" \
            --body "$(cat <<EOF
          A new Qdrant release **${latest}** is available. We are currently aligned with **${baseline}**.

          Release notes: https://github.com/qdrant/qdrant/releases/tag/${latest}

          ## Action needed

          - [ ] Review the release notes for API changes
          - [ ] Add any new fields to the DTOs in \`runtime/src/main/java/.../model/\`
          - [ ] Update \`.github/qdrant-api-baseline.json\` with the new version
          - [ ] Bump the Dev Services image in \`QdrantBuildConfig.java\`
          - [ ] Move the \`compatibility\` matrix in \`.github/workflows/build.yml\` forward: add the previous default, drop the version that falls out of the window
          - [ ] Update the supported versions listed in \`docs/modules/ROOT/pages/index.adoc\` and \`CONTRIBUTING.md\`

          ## Keep the supported window working

          The extension supports the three most recent Qdrant minor releases and nothing
          older, so this release pushes one version out of the window. The \`compatibility\`
          job in \`build.yml\` tests every version still in it. Qdrant's REST API does not
          reject unknown fields, so a field an older server does not understand is dropped
          silently instead of failing. These rules are what protect those users:

          - Add fields. Never rename, retype or remove an existing one. Renaming
            \`SearchRequest.vector\` to \`query\` is what silently narrowed support before.
          - Use boxed types (\`Integer\`, \`Boolean\`, \`Float\`) for new fields, never
            primitives, so a field an older server omits reads as \`null\` and not \`0\`.
          - Keep \`@JsonInclude(NON_NULL)\` on request DTOs so unset fields stay off the wire.
          EOF
          )"
